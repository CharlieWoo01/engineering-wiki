name: External links

# External sites are slow, rate-limited or temporarily down, so they are checked
# on a schedule rather than blocking every pull request. Failures open an issue
# for triage instead of failing CI.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  external-links:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,403,429
            --exclude-path node_modules
            'src/content/**/*.md' 'src/content/**/*.mdx' 'templates/*.md' README.md
          fail: false
          output: lychee-report.md
      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue create --title "Broken external links ($(date -u +%F))" --body-file lychee-report.md --label documentation
