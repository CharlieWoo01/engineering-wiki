name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one production deployment at a time. In-progress deployments are allowed
# to finish; a newer queued run replaces any older queued run.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build site
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        run: pnpm build
        env:
          # Taken from the Pages configuration, so a custom domain is picked up
          # automatically (origin changes, base path becomes "/").
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Write deployment summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Deployed to GitHub Pages"
            echo
            echo "**URL:** <${PAGE_URL}>"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
