version: 2
updates:
  - package-ecosystem: npm # Also handles pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'starlight-*', '@expressive-code/*', 'mermaid']
      fonts:
        patterns: ['@fontsource-variable/*']
      testing:
        patterns: ['vitest', '@playwright/test', '@axe-core/*']
      linting:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'typescript-eslint',
            'globals',
            'prettier',
            'prettier-plugin-*',
            'markdownlint-cli2',
          ]
    ignore:
      # TypeScript is held at 6.x until typescript-eslint and @astrojs/check support 7.x.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    # Also covers the composite action in .github/actions/.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: 'chore(actions)'
    groups:
      github-actions:
        patterns: ['*']
