name: Site bug
description: Report a problem with the website itself — layout, navigation, search, build or deployment.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox 146 on Windows 11, Safari on iPhone
