name: Documentation request or correction
description: Suggest a new page, or report content that is missing, wrong or out of date.
title: '[Docs]: '
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the wiki. **Do not include secrets, internal hostnames or other sensitive information** — issues are public.
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options:
        - New page or section
        - Correction to existing content
        - Content is out of date
        - Unclear or hard to find
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      description: The affected page, if any.
      placeholder: https://charliewoo01.github.io/engineering-wiki/...
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should change, and why?
    validations:
      required: true
